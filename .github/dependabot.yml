version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current, using the
  # `# vX.Y.Z` comment next to each pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same 7-day wait as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
